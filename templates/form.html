<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ action }} Movie</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="top-nav">
        <div class="container nav-content">
            <a href="/" class="logo">Movies Database</a>
        </div>
    </nav>

    <div class="container main-content">
        <div class="form-container">
            <h1>{{ action }} Movie</h1>
            
            <form method="POST">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="title" required 
                           value="{{ movie.Series_Title if movie else '' }}">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" name="year" required 
                               value="{{ movie.Released_Year if movie else '' }}">
                    </div>

                    <div class="form-group">
                        <label>Rating (0-10)</label>
                        <input type="number" step="0.1" name="rating" 
                               value="{{ movie.IMDB_Rating if movie else '' }}">
                    </div>
                    
                    <div class="form-group">
                        <label>Runtime (min)</label>
                        <input type="number" name="runtime" 
                               value="{{ movie.RuntimeMinutes if movie else '' }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Poster Image URL</label>
                    <input type="text" name="poster" 
                           value="{{ movie.Poster_Link if movie else '' }}">
                </div>

                <div class="form-group">
                    <label>Overview</label>
                    <textarea name="overview" rows="5">{{ movie.Overview if movie else '' }}</textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Movie</button>
                    <a href="/" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
